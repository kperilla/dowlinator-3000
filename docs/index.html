<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dovvlinator MMM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap">
<style>
:root{--bg:#fbfaf7;--fg:#22201c;--muted:#6f6a60;--line:#e2ded5;--head:#f1eee7;--accent:#8a3324;--chip:#efe7dc}
@media (prefers-color-scheme:dark){:root{--bg:#1a1917;--fg:#ebe7df;--muted:#a19b90;--line:#36332e;--head:#24221f;--accent:#e08a6f;--chip:#2c2925}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
     gap:36px;padding:32px 16px;background:var(--bg);color:var(--fg);font:15px/1.5 Georgia,"Iowan Old Style",serif;
     text-align:center}
h1{margin:0;font:600 clamp(40px,10vw,96px)/1.1 Cinzel,"Trajan Pro","Times New Roman",serif;
   letter-spacing:.12em;color:var(--accent)}
.sub{margin:10px 0 0;color:var(--muted);font:15px system-ui,sans-serif}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.choices a{display:block;min-width:220px;padding:18px 28px;border:1px solid var(--line);border-radius:12px;
           background:var(--chip);color:var(--fg);text-decoration:none;
           font:600 22px/1.2 Cinzel,"Trajan Pro","Times New Roman",serif;letter-spacing:.08em;
           transition:border-color .15s,color .15s,transform .15s}
.choices a span{display:block;margin-top:6px;font:13px system-ui,sans-serif;letter-spacing:0;color:var(--muted)}
.choices a:hover,.choices a:focus-visible{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
footer{color:var(--muted);font:12px system-ui,sans-serif}
</style>
</head>
<body>

<header>
  <h1>Dovvlinator MMM</h1>
  <p class="sub">Latin verb and noun tables to study and quiz yourself on</p>
</header>

<div class="choices">
  <a href="declensions.html">Declensions<span>nouns &amp; pronouns</span></a>
  <a href="conjugations.html">Conjugations<span>verbs</span></a>
</div>

<footer>Forms from <a href="https://en.wiktionary.org/" style="color:inherit">English Wiktionary</a>, CC BY-SA</footer>

</body>
</html>
