<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dovvlinator MMM · Declensions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap">
<!--
  Declension page template for show_conjugations.py, which replaces these markers:
    NOUN_NAV  links to each group (1st declension, …, pronouns), in the nav bar
    NOUNS     one <section class="group"> per group, holding a table per word
    SOURCE    where the data came from and when
-->
<link rel="stylesheet" href="tables.css">
<link rel="stylesheet" href="declensions.css">
</head>
<body class="hide">

<header><h1><a href="index.html">Dovvlinator MMM</a></h1>
  <div class="pages"><a href="conjugations.html">Conjugations</a> · <a href="declensions.html" aria-current="page">Declensions</a></div>
</header>

<nav>
  <!-- NOUN_NAV -->
  <div class="controls">
    <label><input type="checkbox" id="hide" checked> Hide forms</label>
    <label><input type="checkbox" id="quiz"> Quiz mode</label>
    <span class="quiz-only">
      <label><input type="checkbox" id="nomacrons"> Ignore macrons</label>
      <button type="button" id="gradeall">Grade All</button>
      <button type="button" id="reset">Clear</button>
    </span>
  </div>
</nav>

<div id="macrons" title="Shift-click for capitals">
  <button type="button">ā</button><button type="button">ē</button><button type="button">ī</button><button type="button">ō</button><button type="button">ū</button><button type="button">ȳ</button>
  <span class="hint">or type a vowel + hyphen:<br><kbd>a-</kbd> → ā</span>
</div>

<main>
  <!-- NOUNS -->
  <p class="meta"><!-- SOURCE --></p>
</main>

<script src="tables.js"></script>
</body>
</html>
